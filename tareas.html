<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Gamer · Lista de Tareas</title>
    <style>
        :root {
            --fondo: #121212;
            --texto: #F5F5F5;
            --acento: #00E676;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .titulo {
            font-size: 2rem;
            color: var(--acento);
            text-align: center;
            letter-spacing: 2px;
        }

        .h-titulo {
            font-size: 1.5rem;
            color: var(--acento);
            text-align: center;
            margin-bottom: 15px;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 3px solid var(--acento);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.15);
        }

        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            border: 2px solid var(--acento);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        }

        .conten-principal {
            flex: 1;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .tarjeta {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.12);
            animation: aparecer 0.5s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .campo {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .campo input {
            flex: 1;
            min-width: 0;
            padding: 12px 15px;
            font-size: 1rem;
            color: var(--texto);
            background-color: #1e1e1e;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .campo input:focus {
            border-color: var(--acento);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .contador {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--acento);
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 10px 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.1);
        }

        .lista-tareas {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tarea {
            display: flex;
            align-items: center;
            gap: 14px;
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-left: 4px solid var(--acento);
            border-radius: 12px;
            padding: 14px 18px;
            animation: aparecer 0.4s ease;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        .tarea.completada {
            opacity: 0.55;
            border-left-color: #2a2a2a;
        }

        .tarea input[type="checkbox"] {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            accent-color: var(--acento);
            cursor: pointer;
        }

        .tarea-texto {
            flex: 1;
            min-width: 0;
            font-size: 1rem;
            color: var(--texto);
            word-break: break-word;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .tarea.completada .tarea-texto {
            text-decoration: line-through;
            color: #8a8a8a;
        }

        .tarea-eliminar {
            flex-shrink: 0;
        }

        .botones_1 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .boton_1 {
            display: inline-block;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #121212;
            background-color: var(--acento);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.35);
        }

        .boton_1:hover {
            transform: translateY(-3px);
            background-color: #00c853;
            box-shadow: 0 8px 22px rgba(0, 230, 118, 0.55);
        }

        .boton_1:active {
            transform: translateY(0);
        }

        .boton_volver {
            background-color: #202020;
            color: var(--acento);
            border: 2px solid var(--acento);
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.15);
        }

        .boton_volver:hover {
            background-color: #2a2a2a;
            box-shadow: 0 8px 22px rgba(0, 230, 118, 0.35);
        }

        .boton_eliminar {
            padding: 10px 18px;
            font-size: 0.9rem;
            background-color: #FF5252;
            box-shadow: 0 4px 12px rgba(255, 82, 82, 0.35);
        }

        .boton_eliminar:hover {
            background-color: #e04545;
            box-shadow: 0 8px 22px rgba(255, 82, 82, 0.55);
        }

        .mensaje {
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            text-align: center;
            display: none;
            animation: aparecer 0.3s ease;
            margin-bottom: 20px;
        }

        .mensaje-error {
            display: block;
            color: #FF5252;
            background-color: #2a1212;
            border: 1px solid #FF5252;
        }

        .mensaje-exito {
            display: block;
            color: #121212;
            background-color: var(--acento);
            border: 1px solid var(--acento);
        }

        .sin-tareas {
            text-align: center;
            color: #8a8a8a;
            font-size: 1rem;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 3px solid var(--acento);
            background-color: #1a1a1a;
            font-size: 0.9rem;
            color: #8a8a8a;
        }

        footer span {
            color: var(--acento);
        }

        @media (max-width: 768px) {
            .titulo {
                font-size: 1.6rem;
            }

            .h-titulo {
                font-size: 1.25rem;
            }

            .boton_1 {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .titulo {
                font-size: 1.35rem;
            }

            .tarjeta {
                padding: 18px;
            }

            .campo {
                flex-direction: column;
            }

            .tarea {
                flex-wrap: wrap;
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="contenedor">
            <div class="logo">🎮</div>
            <h1 class="titulo">Academia Gamer</h1>
        </div>
    </header>

    <main class="conten-principal">
        <section class="tarjeta" id="tareas">
            <h2 class="h-titulo">Mis Tareas ✅</h2>
            <p class="subtitulo" style="text-align:center; color:#c9c9c9; margin-bottom:20px;">
                Organiza tus actividades escolares.
            </p>

            <div class="mensaje" id="mensaje"></div>

            <div class="campo">
                <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea..." autocomplete="off">
                <button class="boton_1" id="btn-agregar">➕ Agregar tarea</button>
            </div>

            <div class="contador">Tareas pendientes: <span id="contador">0</span></div>

            <div class="lista-tareas" id="lista-tareas"></div>
        </section>

        <div class="botones_1">
            <a href="menu.html" class="boton_1 boton_volver">🏠 Volver al menú</a>
        </div>
    </main>

    <footer>
        <p>Academia Gamer &copy; 2026 · Hecho con <span>♥</span> por Juana Valentina</p>
    </footer>

    <script>
        const CLAVE_TAREAS = 'tareas';

        const inputNueva = document.getElementById('nueva-tarea');
        const btnAgregar = document.getElementById('btn-agregar');
        const mensaje = document.getElementById('mensaje');
        const listaTareas = document.getElementById('lista-tareas');
        const contadorEl = document.getElementById('contador');

        function obtenerTareas() {
            try {
                const datos = JSON.parse(localStorage.getItem(CLAVE_TAREAS));
                return Array.isArray(datos) ? datos : [];
            } catch (e) {
                return [];
            }
        }

        function guardarTareas(tareas) {
            localStorage.setItem(CLAVE_TAREAS, JSON.stringify(tareas));
        }

        function mostrarMensaje(tipo, texto) {
            mensaje.className = 'mensaje mensaje-' + tipo;
            mensaje.textContent = texto;
            setTimeout(() => {
                mensaje.className = 'mensaje';
            }, 3000);
        }

        function actualizarContador() {
            const tareas = obtenerTareas();
            const pendientes = tareas.filter((t) => !t.completada).length;
            contadorEl.textContent = pendientes;
        }

        function crearTareaDOM(tarea) {
            const div = document.createElement('div');
            div.className = 'tarea' + (tarea.completada ? ' completada' : '');
            div.dataset.id = tarea.id;

            const check = document.createElement('input');
            check.type = 'checkbox';
            check.checked = tarea.completada;

            const texto = document.createElement('span');
            texto.className = 'tarea-texto';
            texto.textContent = tarea.texto;

            const boton = document.createElement('button');
            boton.className = 'boton_1 boton_eliminar tarea-eliminar';
            boton.textContent = '🗑 Eliminar';

            check.addEventListener('change', () => {
                const tareas = obtenerTareas();
                const t = tareas.find((item) => item.id === tarea.id);
                if (t) {
                    t.completada = check.checked;
                    guardarTareas(tareas);
                    div.classList.toggle('completada', t.completada);
                    actualizarContador();
                }
            });

            texto.addEventListener('click', () => {
                check.checked = !check.checked;
                check.dispatchEvent(new Event('change'));
            });

            boton.addEventListener('click', () => {
                let tareas = obtenerTareas();
                tareas = tareas.filter((item) => item.id !== tarea.id);
                guardarTareas(tareas);
                div.remove();
                actualizarContador();
                mostrarMensaje('exito', '✔ Tarea eliminada.');
                renderizarTareas();
            });

            div.appendChild(check);
            div.appendChild(texto);
            div.appendChild(boton);

            return div;
        }

        function renderizarTareas() {
            const tareas = obtenerTareas();
            listaTareas.innerHTML = '';

            if (tareas.length === 0) {
                const vacio = document.createElement('p');
                vacio.className = 'sin-tareas';
                vacio.textContent = '📭 No tienes tareas pendientes. ¡Agrega la primera!';
                listaTareas.appendChild(vacio);
                return;
            }

            tareas.forEach((tarea) => {
                listaTareas.appendChild(crearTareaDOM(tarea));
            });

            actualizarContador();
        }

        function agregarTarea() {
            const texto = inputNueva.value.trim();

            if (texto === '') {
                mostrarMensaje('error', '⚠ Error: escribe una tarea antes de agregarla.');
                inputNueva.focus();
                return;
            }

            const tareas = obtenerTareas();
            tareas.push({
                id: Date.now(),
                texto: texto,
                completada: false
            });
            guardarTareas(tareas);

            inputNueva.value = '';
            inputNueva.focus();

            mostrarMensaje('exito', '✔ Tarea agregada correctamente.');
            renderizarTareas();
        }

        btnAgregar.addEventListener('click', agregarTarea);

        inputNueva.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                agregarTarea();
            }
        });

        renderizarTareas();
    </script>
</body>
</html>
